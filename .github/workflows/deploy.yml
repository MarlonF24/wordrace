name: Build and Deploy WordRace Web

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    permissions:
      packages: write
      contents: read
    env:
      REGISTRY: ghcr.io

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set environment variables
        run: |
          IMAGE_NAME_BASE="${REGISTRY}/${GITHUB_REPOSITORY,,}/web"
          echo "IMAGE_NAME=${IMAGE_NAME_BASE}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=long

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # Built natively on ARM64 hardware
          platforms: linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Copy deployment files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          source: "docker-compose.yml,Caddyfile"
          target: "~/wordrace"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          envs: REGISTRY,APP_IMAGE,DB_USER,DB_PASSWORD,DB_NAME,GITHUB_TOKEN,CADDY_EMAIL,DOMAIN
          script: |
            cd ~/wordrace
            echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin
            docker compose up -d --pull always
            docker image prune -f
            docker logout "$REGISTRY"
        env:
          REGISTRY: ${{ env.REGISTRY }}
          APP_IMAGE: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CADDY_EMAIL: ${{ secrets.CADDY_EMAIL }}
          DOMAIN: ${{ vars.STRIPPED_DOMAIN }}

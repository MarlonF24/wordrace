name: Deploy search agent

on:
  push:
    branches: [main]
    paths:
      - apps/search_agent/**
      - docker-compose.yml
      - scripts/deploy-service.sh
      - .github/workflows/deploy-search-agent.yml
  workflow_dispatch:
    inputs:
      model_revision:
        description: Hugging Face model tag or full commit (defaults to the repository variable)
        required: false
        type: string

concurrency:
  group: wordrace-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  SEARCH_MODEL_REVISION: ${{ inputs.model_revision || vars.SEARCH_MODEL_REVISION }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Validate model configuration
        env:
          SEARCH_MODEL_REPOSITORY: ${{ vars.SEARCH_MODEL_REPOSITORY }}
        run: |
          test -n "$SEARCH_MODEL_REPOSITORY"
          test -n "$SEARCH_MODEL_REVISION"

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image names
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}/search-agent" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push search-agent image
        uses: docker/build-push-action@v7
        with:
          context: apps/search_agent
          file: apps/search_agent/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            SEARCH_MODEL_REPOSITORY=${{ vars.SEARCH_MODEL_REPOSITORY }}
            SEARCH_MODEL_REVISION=${{ env.SEARCH_MODEL_REVISION }}
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha,scope=search-agent
          cache-to: type=gha,mode=max,scope=search-agent

      - name: Copy deployment definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          source: docker-compose.yml,Caddyfile,.env.example,scripts/deploy-service.sh
          target: ~/wordrace
          overwrite: true

      - name: Deploy only the search-agent service
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE_NAME: search_agent_app
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          envs: REGISTRY,GHCR_USERNAME,GHCR_TOKEN,SERVICE_NAME
          command_timeout: 20m
          script: |
            set -eu
            cd ~/wordrace
            printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout "$REGISTRY"' EXIT
            bash scripts/deploy-service.sh "$SERVICE_NAME"

name: Deploy Next.js app

on:
  push:
    branches: [main]
    paths:
      - apps/nextjs_app/**
      - docker-compose.yml
      - Caddyfile
      - scripts/deploy-service.sh
      - .github/workflows/deploy-nextjs.yml
  workflow_dispatch:

concurrency:
  group: wordrace-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set image names
        run: |
          echo "IMAGE_NAME=${REGISTRY}/${GITHUB_REPOSITORY,,}/nextjs" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Next.js image
        uses: docker/build-push-action@v7
        with:
          context: apps/nextjs_app
          file: apps/nextjs_app/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha,scope=nextjs
          cache-to: type=gha,mode=max,scope=nextjs

      - name: Copy deployment definition
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          source: docker-compose.yml,Caddyfile,.env.example,scripts/deploy-service.sh
          target: ~/wordrace
          overwrite: true

      - name: Deploy only the Next.js service
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY: ${{ env.REGISTRY }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SERVICE_NAME: nextjs_app
        with:
          host: ${{ secrets.ORACLE_HOST }}
          username: ${{ secrets.ORACLE_USER }}
          key: ${{ secrets.ORACLE_SSH_KEY }}
          fingerprint: ${{ secrets.ORACLE_HOST_FINGERPRINT }}
          envs: REGISTRY,GHCR_USERNAME,GHCR_TOKEN,SERVICE_NAME
          command_timeout: 20m
          script: |
            set -eu
            cd ~/wordrace
            printf '%s' "$GHCR_TOKEN" | docker login "$REGISTRY" -u "$GHCR_USERNAME" --password-stdin
            trap 'docker logout "$REGISTRY"' EXIT
            bash scripts/deploy-service.sh "$SERVICE_NAME"

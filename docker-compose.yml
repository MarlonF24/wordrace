name: wordrace

x-database-environment: &database-environment
  DB_HOST: db
  DB_PORT: 5432
  DB_NAME: ${DB_NAME:-wordrace}
  DB_USER: ${DB_USER:?Missing DB_USER environment variable}
  DB_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD environment variable}

x-nextjs-environment: &nextjs-environment
  <<: *database-environment
  DATA_SCHEMA: ${DATA_SCHEMA:-public}
  DICT_SCHEMA: ${DICT_SCHEMA:-dictionary}

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${DB_USER:?Missing DB_USER environment variable}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Missing DB_PASSWORD environment variable}
      POSTGRES_DB: ${DB_NAME:-wordrace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  nextjs_migrate:
    image: ${NEXTJS_APP_IMAGE:?Missing NEXTJS_APP_IMAGE environment variable}
    restart: "no"
    environment: *nextjs-environment
    depends_on:
      db:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - exec bun "$$MIGRATION_SCRIPT_PATH"

  nextjs_app:
    image: ${NEXTJS_APP_IMAGE:?Missing NEXTJS_APP_IMAGE environment variable}
    restart: unless-stopped
    environment:
      <<: *nextjs-environment
      HOSTNAME: 0.0.0.0
      PORT: 3000
      SEARCH_AGENT_URL: http://search_agent_app:${SEARCH_AGENT_PORT:-8000}
    depends_on:
      nextjs_migrate:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - await fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) })
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  search_agent_migrate:
    image: ${SEARCH_AGENT_APP_IMAGE:?Missing SEARCH_AGENT_APP_IMAGE environment variable}
    restart: "no"
    environment: *database-environment
    depends_on:
      nextjs_migrate:
        condition: service_completed_successfully
    command: ["alembic", "upgrade", "head"]

  search_agent_app:
    image: ${SEARCH_AGENT_APP_IMAGE:?Missing SEARCH_AGENT_APP_IMAGE environment variable}
    restart: unless-stopped
    environment:
      <<: *database-environment
      API_HOST: 0.0.0.0
      API_PORT: ${SEARCH_AGENT_PORT:-8000}
    depends_on:
      search_agent_migrate:
        condition: service_completed_successfully
    expose:
      - ${SEARCH_AGENT_PORT:-8000}
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import os, urllib.request; urllib.request.urlopen('http://127.0.0.1:' + os.environ['API_PORT'] + '/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Missing DOMAIN environment variable}
      CADDY_EMAIL: ${CADDY_EMAIL:?Missing CADDY_EMAIL environment variable}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      nextjs_app:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
